hosts.forEach((h,k)=>{const sr=h.attachShadow({mode:"open"});sr.appendChild(document.getElementById("tpl"+(k+1)).content.cloneNode(true));fns[k](sr,h)});
function show(k){hosts.forEach((h,j)=>h.hidden=j!==k);tabs.forEach((t,j)=>t.setAttribute("aria-selected",j===k));scrollTo(0,0);requestAnimationFrame(()=>dispatchEvent(new Event("resize")))}
tabs.forEach((t,k)=>t.onclick=()=>show(k));
addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,textarea"))return;if(["1","2","3"].includes(e.key))show(+e.key-1)});
const mo=new MutationObserver(m=>{const t=m[0].target.dataset.theme;hosts.forEach(h=>{if(h.dataset.theme!==t)h.dataset.theme=t})});
hosts.forEach(h=>mo.observe(h,{attributes:true,attributeFilter:["data-theme"]}));
</script></body></html>
